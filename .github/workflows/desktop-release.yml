name: Desktop Release

on:
  push:
    tags:
      - desktop-v*

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    env:
      SPARKLE_VERSION: 2.7.1
      SPARKLE_ARCHIVE_SHA256: ${{ secrets.SPARKLE_ARCHIVE_SHA256 }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
      DSH_RUNTIME_SIGNING_PRIVATE_KEY: ${{ secrets.DSH_RUNTIME_SIGNING_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ vars.DSH_UPSTREAM_REF || '47f943859bef60e4160492346772ded9b24f765a' }}
          path: deepseek-harness
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Install Sparkle
        run: ./scripts/fetch-sparkle.sh
      - name: Configure Sparkle public key
        run: plutil -replace SUPublicEDKey -string "$SPARKLE_PUBLIC_KEY" src-tauri/Info.plist
      - name: Configure runtime public key
        run: node scripts/configure-runtime-public-key.mjs
      - name: Build pinned runtime
        run: ./scripts/package-runtime.sh deepseek-harness runtime
      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile
      - name: Resolve desktop release channel
        id: release
        run: |
          VERSION=${GITHUB_REF_NAME#desktop-v}
          case "$VERSION" in
            *-beta.*) CHANNEL=beta ;;
            *) CHANNEL=stable ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
      - name: Build desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          APPLE_CERTIFICATE: ${{ env.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ env.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ env.APPLE_NOTARY_ISSUER }}
          APPLE_API_KEY: ${{ env.APPLE_NOTARY_KEY_ID }}
          APPLE_API_PRIVATE_KEY: ${{ env.APPLE_NOTARY_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: DeepSeek Harness Desktop ${{ github.ref_name }}
          releaseBody: See the release notes attached to this GitHub release.
          releaseDraft: false
          prerelease: ${{ steps.release.outputs.channel == 'beta' }}
          args: --target aarch64-apple-darwin --config src-tauri/tauri.release.conf.json
      - name: Stage Sparkle archive
        id: sparkle
        run: |
          VERSION=${{ steps.release.outputs.version }}
          APP=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          mkdir -p release-assets/appcast
          ZIP=release-assets/appcast/DeepSeek-Harness-Desktop-$VERSION.zip
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle_private_key"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
      - name: Generate Sparkle appcast
        run: |
          GENERATE_APPCAST=src-tauri/native/frameworks/Sparkle.framework/Versions/B/Resources/bin/generate_appcast
          SIGN_UPDATE=src-tauri/native/frameworks/Sparkle.framework/Versions/B/Resources/bin/sign_update
          CHANNEL=${{ steps.release.outputs.channel }}
          ZIP=${{ steps.sparkle.outputs.zip }}
          "$SIGN_UPDATE" --ed-key-file "$RUNNER_TEMP/sparkle_private_key" "$ZIP" > "$ZIP.signature"
          "$GENERATE_APPCAST" \
            --ed-key-file "$RUNNER_TEMP/sparkle_private_key" \
            --download-url-prefix "https://github.com/itsVicOC/deepseek-harness-desktop/releases/download/desktop-$CHANNEL/" \
            -o "release-assets/appcast/appcast-$CHANNEL.xml" \
            release-assets/appcast
      - name: Upload versioned Sparkle assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release-assets/appcast/*
      - name: Publish channel feed
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-${{ steps.release.outputs.channel }}
          prerelease: ${{ steps.release.outputs.channel == 'beta' }}
          make_latest: false
          files: |
            release-assets/appcast/*
