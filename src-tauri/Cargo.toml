[package]
name = "deepseek-harness-desktop"
version = "0.1.0"
description = "Apple Silicon desktop host for DeepSeek Harness"
authors = ["itsVicOC"]
license = "MIT"
repository = "https://github.com/itsVicOC/deepseek-harness-desktop"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "deepseek_harness_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1.2"
tauri-build = { version = "2.4", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
cookie = "0.18"
dirs = "6.0"
ed25519-dalek = "2.1"
flate2 = "1.0"
hex = "0.4"
httparse = "1.10"
keyring = { version = "3.6", features = ["apple-native"] }
quick-xml = "0.37"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
tauri = { version = "2.8", features = ["macos-private-api"] }
tempfile = "3.14"
thiserror = "2.0"
tokio = { version = "1.42", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
uuid = { version = "1.11", features = ["v4"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
